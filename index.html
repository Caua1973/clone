<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Consultar Series</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/get.js" defer></script>
</head>
<body>
    <header>
        <h1>Lista de Séries</h1>
    </header>
    <main>
        <a href="/pages/cadastro.html">Ir para o cadastro</a>
        <section id="conteiner-titulo-lista">
            <h2 id="titulo-lista">Séries cadastradas</h2>
            <p>As séries são carregadas automaticamente ao iniciar a página</p>
            <p id="resposta"></p>
            <ul id="lista-series"></ul>
        </section>
    </main>
    <template id="modelo-serie">
        <li>
            <section class="card-capa">
                <img alt="">
            </section>
            <section class="card-conteudo">
                <h3 class="menu"></h3>
                <p><strong>Gênero:</strong><span class="genero"></span></p>
                <p><strong>Título:</strong><span class="title"></span></p>
                <p><strong>numero_temporadas:</strong><span class="numero_temporadas"></span></p> 
                <p><strong>Lançamento:</strong><span class="ano_lancamento"></span></p>
                <p><strong>plataforma:</strong><span class="plataforma"></span></p>
            </section>
        </li>
    </template>
</body>
<footer>
        <p><small><p>Prática com método GET: buscar e exibir séries da API do Codeverse</p></small></p>
    </footer>
</html>
